name: Process Product Images

on:
  issues:
    types: [labeled]

jobs:
  process-images:
    # Only run when the "new-products" label is added
    if: github.event.label.name == 'new-products'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install Pillow

      - name: Extract and download images from issue
        uses: actions/github-script@v7
        id: extract-images
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Create temp directory for downloads
            const tempDir = 'temp_uploads';
            fs.mkdirSync(tempDir, { recursive: true });

            const issueBody = context.payload.issue.body || '';
            const issueTitle = context.payload.issue.title || 'Product';

            // Sanitize issue title for use as filename
            const baseFilename = issueTitle
              .replace(/[<>:"/\\|?*]/g, '') // Remove invalid filename chars
              .replace(/\s+/g, ' ')          // Normalize whitespace
              .trim();

            // Match GitHub-hosted image URLs
            // Pattern: ![...](url)
            const imagePattern = /!\[[^\]]*\]\((https:\/\/(?:user-images\.githubusercontent\.com|github\.com\/user-attachments\/assets)\/[^\s\)]+)\)/g;

            const imageUrls = [];
            for (const match of issueBody.matchAll(imagePattern)) {
              imageUrls.push(match[1]);
            }

            if (imageUrls.length === 0) {
              core.setOutput('image_count', '0');
              core.setFailed('No images found in the issue body');
              return;
            }

            console.log(`Found ${imageUrls.length} images to process`);
            console.log(`Using issue title as filename: "${baseFilename}"`);

            let downloaded = 0;
            for (let i = 0; i < imageUrls.length; i++) {
              const url = imageUrls[i];
              try {
                // Use issue title as filename, add number if multiple images
                let filename;
                if (imageUrls.length === 1) {
                  filename = `${baseFilename}.jpg`;
                } else {
                  filename = `${baseFilename} ${i + 1}.jpg`;
                }

                console.log(`Downloading: ${filename}`);

                const response = await fetch(url);
                if (!response.ok) {
                  console.log(`Failed to download ${url}: ${response.status}`);
                  continue;
                }

                const buffer = await response.arrayBuffer();
                fs.writeFileSync(path.join(tempDir, filename), Buffer.from(buffer));
                downloaded++;
              } catch (error) {
                console.log(`Error downloading ${url}: ${error.message}`);
              }
            }

            core.setOutput('image_count', downloaded.toString());
            console.log(`Successfully downloaded ${downloaded} images`);

      - name: Process images
        if: steps.extract-images.outputs.image_count != '0'
        run: |
          python scripts/compress_images.py --input temp_uploads --output products
          python scripts/update_products.py

      - name: Commit and push changes
        if: steps.extract-images.outputs.image_count != '0'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add products/ products/products.json
          git commit -m "Add ${{ steps.extract-images.outputs.image_count }} new product images

          Processed from issue #${{ github.event.issue.number }}

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push

      - name: Comment on issue with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const imageCount = parseInt('${{ steps.extract-images.outputs.image_count }}') || 0;
            const issueTitle = context.payload.issue.title;

            let comment;
            if (imageCount === 0) {
              comment = `## No images found

            I couldn't find any images in this issue. Please make sure to:
            1. Drag and drop images directly into the issue body
            2. Wait for them to upload before submitting

            Then remove and re-add the \`new-products\` label to try again.`;
            } else {
              // Generate filenames the same way as the download step
              let imageList;
              if (imageCount === 1) {
                imageList = `- ${issueTitle}.jpg`;
              } else {
                imageList = Array.from({length: imageCount}, (_, i) =>
                  `- ${issueTitle} ${i + 1}.jpg`
                ).join('\n');
              }

              comment = `## Successfully processed ${imageCount} image(s)

            The following images have been compressed and added to the products folder:

            ${imageList}

            The website will update automatically once GitHub Pages rebuilds.`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

            // Close the issue if successful
            if (imageCount > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
            }
